<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIOS 2026 — Liste de Prix</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2044; --blue: #1a4a8a; --sky: #2d7dd2; --ice: #e8f2fc;
    --mint: #d4edda; --mint-text: #1a5c2e;
    --gray-50: #f7f9fc; --gray-100: #edf2f7; --gray-300: #cbd5e0; --gray-500: #718096; --gray-700: #2d3748;
    --accent: #f0a500; --radius: 10px; --shadow: 0 4px 24px rgba(15,32,68,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); color: var(--gray-700); min-height: 100vh; }

  header { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); color: white; padding: 20px 24px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(15,32,68,0.25); }
  .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .header-title h1 { font-size: clamp(16px, 3vw, 24px); font-weight: 700; }
  .header-title p { font-size: 11px; opacity: 0.6; margin-top: 2px; font-family: 'DM Mono', monospace; }
  .badge { background: var(--accent); color: var(--navy); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .tabs { display: flex; gap: 4px; }
  .tab-btn { background: rgba(255,255,255,0.12); border: none; color: rgba(255,255,255,0.7); padding: 7px 16px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { background: white; color: var(--navy); font-weight: 700; }
  .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.2); color: white; }
  .view-toggle { display: flex; gap: 4px; margin-left: 8px; }
  .view-btn { background: rgba(255,255,255,0.15); border: none; color: rgba(255,255,255,0.8); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 15px; transition: all 0.15s; }
  .view-btn.active { background: white; color: var(--navy); }

  .filters-bar { background: white; border-bottom: 1px solid var(--gray-100); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 3px; }
  .filter-group label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gray-500); }
  .filter-group select, .filter-group input { font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1.5px solid var(--gray-300); border-radius: 7px; padding: 6px 10px; color: var(--gray-700); background: var(--gray-50); outline: none; transition: border-color 0.2s; min-width: 130px; }
  .filter-group select:focus, .filter-group input:focus { border-color: var(--sky); background: white; }
  .filter-group input { min-width: 200px; }
  .reset-btn { background: var(--gray-100); border: none; color: var(--gray-500); padding: 7px 14px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; height: 34px; }
  .reset-btn:hover { background: var(--gray-300); color: var(--gray-700); }

  .stats-bar { padding: 8px 24px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--gray-500); border-bottom: 1px solid var(--gray-100); background: white; }
  .stats-bar strong { color: var(--navy); font-size: 14px; }

  .content { padding: 20px 24px; }

  /* SECTION GROUPS */
  .section-group { margin-bottom: 24px; }
  .section-title { display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, var(--navy), var(--blue)); color: white; padding: 10px 16px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
  .section-count { background: rgba(255,255,255,0.2); font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; padding: 12px; background: var(--gray-50); border: 1px solid var(--gray-100); border-top: none; border-radius: 0 0 8px 8px; }
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1.5px solid var(--gray-100); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(15,32,68,0.13); }
  .card-header { background: var(--ice); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-100); }
  .card-ahri-label { font-size: 10px; color: var(--gray-500); font-family: 'DM Mono', monospace; }
  .card-ahri-val { font-size: 11px; font-weight: 600; color: var(--navy); font-family: 'DM Mono', monospace; }
  .card-mbtu { background: var(--accent); color: var(--navy); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; font-family: 'DM Mono', monospace; }
  .card-body { padding: 12px; }
  .card-unit { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--gray-100); }
  .card-unit:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .card-model { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--sky); margin-bottom: 3px; }
  .card-desc { font-size: 12px; color: var(--gray-700); margin-bottom: 8px; line-height: 1.4; }
  .card-prices { display: flex; gap: 6px; flex-wrap: wrap; }
  .price-tag { flex: 1; min-width: 90px; background: var(--ice); border-radius: 7px; padding: 6px 10px; }
  .price-tag.sub { background: var(--mint); }
  .price-tag .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gray-500); margin-bottom: 2px; }
  .price-tag.sub .label { color: var(--mint-text); }
  .price-tag .amount { font-size: 13px; font-weight: 700; color: var(--navy); font-family: 'DM Mono', monospace; }
  .price-tag.sub .amount { color: var(--mint-text); }

  /* TABLE */
  .table-wrap { border-radius: 0 0 8px 8px; overflow: hidden; border: 1px solid var(--gray-100); border-top: none; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead tr { background: var(--blue); }
  thead th { color: white; font-weight: 600; padding: 10px 12px; text-align: left; white-space: nowrap; font-size: 11px; }
  tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
  tbody tr:nth-child(even) { background: var(--gray-50); }
  tbody tr:hover { background: var(--ice); }
  tbody td { padding: 8px 12px; vertical-align: middle; }
  .td-model { font-family: 'DM Mono', monospace; color: var(--sky); font-size: 12px; white-space: nowrap; }
  .td-ahri { font-family: 'DM Mono', monospace; color: var(--gray-500); font-size: 11px; white-space: nowrap; }
  .td-price { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--navy); text-align: right; white-space: nowrap; }
  .td-sub { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--mint-text); background: var(--mint); text-align: right; padding: 8px 12px; white-space: nowrap; }
  .td-mbtu { font-weight: 600; color: var(--blue); font-size: 12px; white-space: nowrap; }
  .no-sub { color: var(--gray-300); font-size: 11px; text-align: right; }

  .full-table-wrap { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid var(--gray-100); }
  .full-table-wrap thead tr { background: var(--navy); }
  .td-section { font-weight: 700; color: var(--navy); font-size: 11px; white-space: nowrap; }

  .empty { text-align: center; padding: 60px 20px; color: var(--gray-500); }
  .empty p { font-size: 14px; margin-top: 12px; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .filters-bar { padding: 10px 14px; }
    .content { padding: 12px; }
  }
</style>
</head>

<header>
  <div class="header-top">
    <div class="header-title">

  <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">

    </div>
    <div class="view-toggle" id="viewToggle">

      <button class="view-btn" onclick="setView('table')" title="Tableau">☰</button>
    </div>
  </div>
</header>

<div class="filters-bar">

    <select id="filterSection" onchange="applyFilters()"><option value="">Toutes</option></select>
  </div>
  <div class="filter-group">
    <label>Puissance</label>
    <select id="filterMbtu" onchange="applyFilters()"><option value="">Toutes</option></select>
  </div>
  <div class="filter-group">
    <label>Subvention</label>
    <select id="filterSub" onchange="applyFilters()">

    </select>
  </div>
  <button class="reset-btn" onclick="resetFilters()">✕ Réinitialiser</button>
</div>

<div class="stats-bar">

</div>

  ["PANCAKE","36 MBH","217177269","GPHLA36R4AS1","Thermopompe Elios Pancake 36 000 BTU/h, unité intérieure 115 V",3492,3444],
  ["PANCAKE","36 MBH","217177269","ESHEA36R2AN1","Unité extérieure thermopompe ELIOS 18 000 BTU/h 230V",5309,null],
  ["PANCAKE ELECTRIC HEATER","—","—","EAH03DUL","Electric Heater 3 kW",470,null],
  ["PANCAKE ELECTRIC HEATER","—","—","EAH05DUL","Electric Heater 5 kW",514,null],
  ["PANCAKE ELECTRIC HEATER","—","—","EAH08DUL","Electric Heater 8 kW",562,null],
  ["PANCAKE ELECTRIC HEATER","—","—","EAH10DUL","Electric Heater 10 kW",612,null],
  ["FLOOR CEILING MOUNT","36 MBH","216046634","GVHLA36R2AS1","Thermopompe pour montage au sol et au plafond, unité intérieure de 36 000 BTU",2861,null],
  ["FLOOR CEILING MOUNT","36 MBH","216046634","ESHUA36R2AN1","Unité de thermopompe extérieure Elios 36 000 BTU/h 230 V",6689,null],
  ["FLOOR CEILING MOUNT","48 MBH","216046635","GVHLA48R2AS1","Thermopompe pour montage au sol et au plafond, unité intérieure de 48 000 BTU",3028,5530],
  ["FLOOR CEILING MOUNT","48 MBH","216046635","ESHUA48R2AN1","Unité de thermopompe extérieure Elios 48 000 BTU/h 230 V",9026,null],
];

const sectionOrder = ["MURALE À -20°C","MURALE À -30°C","CASSETTE SIMPLE","CASSETTE 2-4 VOIES","CASSETTE 4 VOIES","CASSETTE 3-4 VOIES","GRILLE","UNITÉ GAINABLE","CONSOLE","WALL UTA","UTA - ELECTRIC HEATER","PANCAKE","PANCAKE ELECTRIC HEATER","FLOOR CEILING MOUNT"];

let currentTab = 'resume', currentView = 'cards', filtered = [...rawData];

const fmt = v => v == null ? null : v.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $';

function populateFilters() {
  const secs = [...new Set(rawData.map(r=>r[0]))].sort((a,b)=>(sectionOrder.indexOf(a)||99)-(sectionOrder.indexOf(b)||99));
  const mbtus = [...new Set(rawData.map(r=>r[1]).filter(v=>v!=='—'))].sort((a,b)=>parseFloat(a)-parseFloat(b));
  populateSelect('filterSection', secs);
  populateSelect('filterMbtu', mbtus);
}

function populateSelect(id, vals) {
  const sel = document.getElementById(id);
  while(sel.options.length>1) sel.remove(1);
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sec = document.getElementById('filterSection').value;
  const mbtu = document.getElementById('filterMbtu').value;
  const sub = document.getElementById('filterSub').value;
  filtered = rawData.filter(r => {
    if(sec && r[0]!==sec) return false;
    if(mbtu && r[1]!==mbtu) return false;
    if(sub==='oui' && !r[6]) return false;
    if(sub==='non' && r[6]) return false;
    if(search && ![r[2],r[3],r[4],r[1]].join(' ').toLowerCase().includes(search)) return false;
    return true;
  });
  render();
}

function resetFilters() {
  ['searchInput'].forEach(id=>document.getElementById(id).value='');
  ['filterSection','filterMbtu','filterSub'].forEach(id=>document.getElementById(id).value='');
  filtered=[...rawData]; render();
}

function switchTab(tab) {
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='resume')||(i===1&&tab==='complet')));
  document.getElementById('viewToggle').style.display = tab==='resume'?'flex':'none';
  render();
}

function setView(v) {
  currentView=v;
  document.querySelectorAll('.view-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&v==='cards')||(i===1&&v==='table')));
  render();
}

function groupBySection(rows) {
  const groups={}, order=[];
  rows.forEach(r=>{
    if(!groups[r[0]]){groups[r[0]]={};order.push(r[0]);}
    if(!groups[r[0]][r[2]]) groups[r[0]][r[2]]=[];
    groups[r[0]][r[2]].push(r);
  });
  order.sort((a,b)=>{const ia=sectionOrder.indexOf(a),ib=sectionOrder.indexOf(b);return(ia===-1?99:ia)-(ib===-1?99:ib);});
  return {groups,order};
}

function render() {
  const container=document.getElementById('mainContent');
  const subCount=filtered.filter(r=>r[6]).length;
  document.getElementById('countDisplay').textContent=filtered.length;
  document.getElementById('subCountDisplay').textContent=subCount>0?`· ${subCount} avec subvention 💚`:'';
  if(!filtered.length){container.innerHTML=`<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Aucun résultat pour ces filtres.</p></div>`;return;}
  if(currentTab==='resume') currentView==='cards'?renderCards(container):renderTable(container);
  else renderFullTable(container);
}

function renderCards(container) {
  const {groups,order}=groupBySection(filtered);
  container.innerHTML=order.map(sec=>{
    const ahriGroups=groups[sec];
    const total=Object.values(ahriGroups).flat().length;
    const cards=Object.entries(ahriGroups).map(([ahri,rows])=>`
      <div class="card">
        <div class="card-header">
          <div><span class="card-ahri-label">AHRI </span><span class="card-ahri-val">${ahri}</span></div>
          ${rows[0][1]!=='—'?`<span class="card-mbtu">${rows[0][1]}</span>`:''}
        </div>
        <div class="card-body">
          ${rows.map(r=>`<div class="card-unit">
            <div class="card-model">${r[3]}</div>
            <div class="card-desc">${r[4]}</div>
            <div class="card-prices">
              <div class="price-tag"><div class="label">Prix liste</div><div class="amount">${fmt(r[5])}</div></div>
              ${r[6]?`<div class="price-tag sub"><div class="label">Subvention</div><div class="amount">${fmt(r[6])}</div></div>`:''}
            </div>
          </div>`).join('')}
        </div>
      </div>`).join('');
    return `<div class="section-group"><div class="section-title">${sec}<span class="section-count">${total} produits</span></div><div class="cards-grid">${cards}</div></div>`;
  }).join('');
}

function renderTable(container) {
  const {groups,order}=groupBySection(filtered);
  container.innerHTML=order.map(sec=>{
    const ahriGroups=groups[sec];
    const total=Object.values(ahriGroups).flat().length;
    const rows=Object.entries(ahriGroups).map(([ahri,rws])=>
      rws.map((r,i)=>`<tr>
        ${i===0?`<td class="td-ahri" rowspan="${rws.length}" style="border-right:2px solid var(--gray-100);vertical-align:middle;background:var(--gray-50)">${ahri}</td>`:''}
        <td class="td-mbtu">${r[1]}</td>
        <td class="td-model">${r[3]}</td>
        <td style="font-size:12px;max-width:340px;white-space:normal">${r[4]}</td>
        <td class="td-price">${fmt(r[5])}</td>
        <td class="${r[6]?'td-sub':'no-sub'}">${r[6]?fmt(r[6]):'—'}</td>
      </tr>`).join('')
    ).join('');
    return `<div class="section-group"><div class="section-title">${sec}<span class="section-count">${total} produits</span></div>
      <div class="table-wrap"><div class="table-scroll"><table>
        <thead><tr><th>AHRI</th><th>Puissance</th><th>No. Modèle</th><th>Description</th><th>Prix liste (CAD)</th><th>Subvention (CAD)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div></div>`;
  }).join('');
}

function renderFullTable(container) {
  const rows=filtered.map(r=>`<tr>
    <td class="td-section">${r[0]}</td>
    <td class="td-mbtu">${r[1]}</td>
    <td class="td-ahri">${r[2]}</td>
    <td class="td-model">${r[3]}</td>
    <td style="font-size:12px;max-width:320px;white-space:normal">${r[4]}</td>
    <td class="td-price">${fmt(r[5])}</td>
    <td class="${r[6]?'td-sub':'no-sub'}">${r[6]?fmt(r[6]):'—'}</td>
  </tr>`).join('');
  container.innerHTML=`<div class="full-table-wrap"><div class="table-scroll"><table>
    <thead><tr><th>Section</th><th>Puissance</th><th>AHRI</th><th>No. Modèle</th><th>Description</th><th>Prix liste (CAD)</th><th>Subvention (CAD)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

populateFilters();
render();
</script>
</body>
</html>
